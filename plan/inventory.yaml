  - id: "eino"
    name: "Eino"
    org: "cloudwego"
    lang: "go"
    package: "github.com/cloudwego/eino-ext/components/tool/mcp"
    adapter: "over mark3labs/mcp-go"
    version: "0.0.9 (2026-08-13)"
    reach: "own"
    tier: 3
    reason: "On request. First-party adapter, runs headless, low demand today; promote by moving it back to tier 2."
  - id: "rig"
    name: "rig"
    org: "0xPlaygrounds"
    lang: "rust"
    package: "rig-rmcp"
    adapter: "over rmcp 2"
