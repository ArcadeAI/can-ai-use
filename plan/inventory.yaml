  # ---- tier 3: excluded, with the reason ----
  - id: "llamaindex_ts"
    name: "LlamaIndex.TS"
    org: "run-llama"
    lang: "typescript"
    package: "@llamaindex/tools"
    adapter: "mcp() -> MCPClient"
    version: "0.2.1 (2026-03-09)"
    reach: "sdk1"
    tier: 3
    reason: "Removed 2026-10-07. Every package it runs (@llamaindex/tools, workflow, core, env) is marked deprecated on npm, \"no longer maintained\". Revisit if run-llama ships a maintained TypeScript MCP adapter."
  - id: "claude_agent_sdk"
    name: "Claude Agent SDK"
    org: "anthropics"
    lang: "python+typescript"
    tier: 3
    reason: "The SDK does not connect to MCP servers itself; it serialises the config to the bundled Claude Code CLI, which does. Its behaviour is Claude Code's, so it is measured on the harness page as the headless form of Claude Code. The developer-facing surface exposes no tool definition object to capture."
  - id: "cloudflare_agents"
    name: "Cloudflare Agents SDK"
    org: "cloudflare"
    lang: "typescript"
    tier: 3
    reason: "MCPClientManager lives on a Durable Object and runs only on Workers; no stdio transport. Measurable later through workerd/miniflare with the fixture served over HTTP; a separate task once the recording server exists."
  - id: "letta"
    name: "Letta"
    org: "letta-ai"
    tier: 3
    reason: "The MCP client runs server-side inside Letta Code; the Python package has no mcp dependency and exposes tools only through a hosted API."
  - id: "dify"
    name: "Dify"
    org: "langgenius"
    tier: 3
    reason: "UI-configured platform; vendored SDK fork; no headless run. A platform, not a framework."
  - id: "flowise"
    name: "Flowise"
    org: "FlowiseAI"
    tier: 3
    reason: "No headless run; flows execute through a REST prediction API of a running server. A platform."
  - id: "n8n"
    name: "n8n"
    org: "n8n-io"
    tier: 3
    reason: "No stdio; platform product. `n8n execute --id` exists, so measurable later as a platform row if wanted."
  - id: "langflow"
    name: "LangFlow"
    org: "langflow-ai"
    tier: 3
    reason: "Partial headless (`lfx run` without the server); MCP registration is UI/DB driven. Revisit."
  - id: "motia"
    name: "Motia"
    org: "MotiaDev"
    tier: 3
    reason: "No MCP client or server anywhere in the repository."
  - id: "semantic_kernel_dotnet"
    name: "Semantic Kernel (.NET)"
    org: "microsoft"
    tier: 3
    reason: "No first-party package; samples only. Python SK is covered."
  - id: "phidata"
    name: "Phidata"
    org: "agno-agi"
    tier: 3
    reason: "Legacy; no MCP adapter. Succeeded by Agno."

harnesses:
  # A harness is measured on the wire only. Level 1 (startup): what it asks the server
  # for before any model call. Level 2 (session): what a fixed prompt makes it do, run N
  # times, needs a model behind it. Both levels use the recording server.
  #
  # headless: the exact one-shot invocation. mcp_config: where the server goes.
  # tier 1 = scriptable end to end. tier 2 = GUI only, needs computer-use. tier 3 = excluded.

  - id: claude_code
    name: Claude Code
    vendor: Anthropic
    tier: 1
    rank: 1
    install: npm i -g @anthropic-ai/claude-code
    registry: npm
    package: "@anthropic-ai/claude-code"
    mcp_config: "--mcp-config <file> --strict-mcp-config (also ~/.claude.json, .mcp.json)"
    headless: 'claude -p "<prompt>" --output-format stream-json --verbose --bare --max-turns 3'
    unattended: "--allowedTools mcp__<server>__* or --permission-mode bypassPermissions"
    startup_lists: yes (tools/list, prompts/list, resources/list after connect; waits MCP_TIMEOUT)
    surfaces: [prompts, resources]
    annotations: honors _meta anthropic/requiresUserInteraction; readOnly/destructive undocumented
    protocol: v2 runtime on SDK 2.0, revision 2026-07-28
  - id: codex
    name: Codex CLI
    vendor: OpenAI
    tier: 1
    rank: 2
    install: npm i -g @openai/codex
    registry: npm
    package: "@openai/codex"
    mcp_config: "~/.codex/config.toml [mcp_servers.<name>] or codex mcp add"
    headless: 'codex exec "<prompt>" --json -o <file> -a never -s workspace-write'
    unattended: "-a never; default_tools_approval_mode"
    startup_lists: yes (initial tool catalog, mcp_optional_startup_grace_ms)
    surfaces: unknown
    annotations: "writes mode prompts for tools not marked read-only"
    protocol: rmcp 3.2.0
  - id: gemini_cli
    name: Gemini CLI
    vendor: Google
    tier: 1
    rank: 4
    install: npm i -g @google/gemini-cli
    registry: npm
    package: "@google/gemini-cli"
    mcp_config: "~/.gemini/settings.json mcpServers or gemini mcp add"
    headless: 'gemini -p "<prompt>" --output-format stream-json --approval-mode yolo'
    unattended: "--approval-mode yolo (trusted folder), --allowed-mcp-server-names"
    startup_lists: yes (discovery at start incl. resources/list)
    surfaces: [prompts, resources]
    annotations: undocumented
    protocol: SDK 1.23.0
  - id: kiro_cli
    name: Kiro CLI
    vendor: AWS
    tier: 1
    rank: 7
    install: see kiro.dev/docs/cli
    mcp_config: ".kiro/settings/mcp.json or kiro-cli mcp add"
    headless: 'kiro-cli chat --no-interactive "<prompt>" --output-format stream-json --trust-all-tools --require-mcp-startup'
    unattended: "--trust-all-tools; ask treated as deny in headless"
    startup_lists: yes (tool specs indexed; exit 3 if MCP startup fails)
    surfaces: [prompts, resources]
  - id: openhands
    name: OpenHands
    vendor: OpenHands
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: pip install openhands
    registry: pypi
    package: "openhands"
    mcp_config: "~/.openhands/mcp.json or openhands mcp add"
    headless: 'openhands --headless --json -t "<prompt>"'
    unattended: "headless forces always-approve"
    startup_lists: yes
    surfaces: none documented
    annotations: skips risk injection when readOnlyHint (source)
  - id: qwen_code
    name: Qwen Code
    vendor: QwenLM
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: npm i -g @qwen-code/qwen-code
    registry: npm
    package: "@qwen-code/qwen-code"
    mcp_config: "~/.qwen/settings.json mcpServers or qwen mcp add"
    headless: 'qwen -p "<prompt>" --output-format stream-json --approval-mode yolo'
    startup_lists: "not guaranteed: discovery runs in the background after the UI is ready"
    surfaces: [prompts, resources]
    annotations: auto classifier receives readOnlyHint/destructiveHint
    protocol: "@modelcontextprotocol/client 2.0.0"
  - id: opencode
    name: OpenCode
    vendor: sst
    tier: 1
    rank: 5
    install: npm i -g opencode-ai
    registry: npm
    package: "opencode-ai"
    mcp_config: "opencode.json mcp (write the file; mcp add is interactive)"
    headless: 'opencode run "<prompt>" --format json --auto'
    startup_lists: yes (tools fetched at state init, timeout 5000ms)
    surfaces: on demand (source)
    protocol: SDK 1.29.0
    unattended: "--auto"
  - id: kilo
    name: Kilo CLI
    vendor: Kilo-Org
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: npm i -g @kilocode/cli
    registry: npm
    package: "@kilocode/cli"
    mcp_config: "kilo.jsonc mcp or kilo mcp add"
    headless: 'kilo run --auto "<prompt>" --format json'
    startup_lists: yes (source)
    protocol: SDK 1.29.0
  - id: cursor_agent
    name: Cursor agent CLI
    vendor: Anysphere
    tier: 1
    rank: 3
    install: curl https://cursor.com/install -fsS | bash
    mcp_config: ".cursor/mcp.json (shared with the IDE)"
    headless: 'agent -p "<prompt>" --output-format stream-json'
    unattended: "--force --approve-mcps (the API key comes from CURSOR_API_KEY)"
    startup_lists: unknown
    surfaces: [prompts, resources]
  - id: amp
    name: Amp
    vendor: Sourcegraph
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: npm i -g @sourcegraph/amp
    mcp_config: "--mcp-config or amp.mcpServers in settings.json"
    headless: 'amp -x "<prompt>" --stream-json'
    unattended: "no approval prompts by default"
    startup_lists: implied (system/init carries mcp_servers status)
    surfaces: "none: MCP Apps, resources and prompts explicitly unsupported"
  - id: pi_cli
    name: Pi
    vendor: earendil-works
    tier: 1
    rank: 10
    install: npm i -g @earendil-works/pi-coding-agent
    registry: npm
    package: "@earendil-works/pi-coding-agent"
    mcp_config: ".pi/mcp.json or pi mcp add"
    headless: 'pi --mode json -p "<prompt>" --no-session'
    startup_lists: yes (first prompt waits up to 10s for connections)
    surfaces: [resources]
    annotations: surfaced to permission extensions (all four hints)
    protocol: "2025-11-25"
  - id: continue_cli
    name: Continue CLI
    vendor: Continue Dev
    tier: 1
    rank: 9
    install: npm i -g @continuedev/cli
    registry: npm
    package: "@continuedev/cli"
    mcp_config: "config.yaml mcpServers via --config"
    headless: 'cn -p "<prompt>" --format json --auto'
    startup_lists: "yes (source: listTools on connect, plus prompts and resources)"
    surfaces: [prompts, resources]
    protocol: SDK ^1.25.2
    unattended: "--auto"
  - id: goose
    name: Goose
    vendor: Agentic AI Foundation
    tier: 1
    rank: 6
    install: brew install goose (or the install script)
    registry: github
    package: "aaif-goose/goose"
    mcp_config: "--with-extension <cmd> / --with-streamable-http-extension <url>"
    headless: 'goose run -t "<prompt>" --output-format stream-json --no-session --with-extension "<cmd>"'
    unattended: "GOOSE_MODE=auto is the default"
    startup_lists: unknown
    protocol: rmcp 3.4.1
  - id: cline_cli
    name: Cline CLI
    vendor: Cline Bot Inc.
    tier: 1
    rank: 8
    install: "npm install --prefix .mcp-mirror/harnesses/cline_cli cline@3.0.66"
    registry: npm
    package: "cline"
    mcp_config: "<CLINE_DATA_DIR or ~/.cline/data>/settings/cline_mcp_settings.json"
    headless: 'cline --json "<prompt>"'
    startup_lists: "tools only"
    unattended: "--auto-approve true (already the default)"
    protocol: "2024-11-05"
    surfaces: [tools]
  - id: deepseek_harness
    name: DeepSeek Harness
    vendor: DeepSeek AI
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: see github.com/deepseek-ai/deepseek-harness (developer preview)
    mcp_config: "cordis.yml, one @deepseek-ai/dsh-mcp-client entry per server"
    headless: 'dsh --profile headless "<prompt>" --json'
    startup_lists: yes (tools appear before the first turn)
    surfaces: [resources]
    protocol: "@modelcontextprotocol/client 2.0.0"
  - id: augment_cli
    name: Augment CLI
    vendor: Augment Code
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: npm i -g @augmentcode/auggie
    mcp_config: "--mcp-config <file>"
    headless: 'auggie --print "<prompt>" --quiet --output-format json --mcp-config <file>'
    unattended: "non-interactive use may be contract-gated"
    startup_lists: implied
  - id: crush
    name: Charm Crush
    vendor: Charmbracelet
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: brew install charmbracelet/tap/crush
    registry: github
    package: "charmbracelet/crush"
    mcp_config: ".crushrc mcp add <name> --type stdio --command <cmd>"
    headless: 'crush run "<prompt>" --yolo -q'
    startup_lists: yes (non-interactive runs wait for MCP init)
    surfaces: "[prompts, resources] (source)"
    note: text output only; parse the recording, not stdout.
  - id: junie_cli
    name: JetBrains Junie CLI
    vendor: JetBrains
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: see junie.jetbrains.com/docs/junie-headless
    mcp_config: ".junie/mcp/mcp.json or --mcp-location"
    headless: 'junie --auth=$KEY --task "<prompt>" --output-format json-stream'
    unattended: "approval in print mode undocumented; measure level 1 only until known"
    startup_lists: unknown
  - id: roo_cli
    name: Roo Code CLI
    vendor: Roo Code Inc.
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: see RooCodeInc/Roo-Code apps/cli
    mcp_config: ".roo/mcp.json (CLI source unstated)"
    headless: 'roo -p "<prompt>" --output-format json --oneshot'
    startup_lists: unknown
  - id: devin_cli
    name: Devin CLI
    vendor: Cognition
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: see docs.devin.ai/cli
    mcp_config: ".devin/mcp_config.json or devin mcp add"
    headless: 'devin -p "<prompt>" --permission-mode autonomous'
    startup_lists: "connections warmed at startup; tools/list unstated"
    surfaces: [prompts]
    note: no JSON output flag; parse the recording.
  - id: warp_cli
    name: Warp Agent CLI
    vendor: Warp
    tier: 2
    later: "Scriptable but low demand; runs after the ranked ten."
    install: see docs.warp.dev/agents/cli
    mcp_config: "--mcp <file|json>"
    headless: 'oz agent run --prompt "<prompt>" --output-format json --mcp <file>'
    note: oz is deprecated at end of September 2026; re-verify the replacement before dispatch.

  # tier 2: GUI only. Measurable only by driving the app's window, one session script
  # each. Not part of the unattended graph.
  - id: "claude_desktop"
    name: "Claude Desktop"
    vendor: "Anthropic"
    tier: 2
    gui: true
    rank: 1
    mcp_config: "claude_desktop_config.json"
    annotations: "documented: read-only tools run without per-call confirmation, destructive tools always prompt"
    surfaces: [prompts, resources]
  - id: "vscode_copilot"
    name: "VS Code with Copilot agent mode"
    vendor: "Microsoft"
    tier: 2
    gui: true
    rank: 2
    mcp_config: ".vscode/mcp.json"
    annotations: "documented: readOnlyHint honored"
    surfaces: [prompts, resources]
  - id: "devin_desktop"
    name: "Devin Desktop (was Windsurf)"
    vendor: "Cognition"
    tier: 3
    reason: "GUI only and low demand; on request."
    mcp_config: "~/.config/devin/mcp_config.json"
    surfaces: [prompts, resources]
  - id: "zed"
    name: "Zed"
    vendor: "Zed Industries"
    tier: 3
    reason: "GUI only and low demand; on request."
    mcp_config: "settings.json context_servers"
    surfaces: [prompts]
  - id: "chatgpt"
    name: "ChatGPT developer mode"
    vendor: "OpenAI"
    tier: 2
    gui: true
    rank: 3
    mcp_config: "Settings UI"
    annotations: "documented: readOnlyHint respected, destructiveHint triggers approval"
    note: "remote servers only"
  - id: "cursor_ide"
    name: "Cursor IDE"
    vendor: "Anysphere"
    tier: 2
    gui: true
    rank: 4
    note: "same config as the agent CLI; the CLI row covers the client unless the IDE differs."
  - id: "replit_agent"
    name: "Replit Agent"
    vendor: "Replit"
    tier: 3
    reason: "GUI only and low demand; on request."
    note: "remote HTTPS only, account-level UI"

  # tier 3: excluded
  - id: "aider"
    name: "Aider"
    tier: 3
    reason: "No MCP client; only third-party bridges."
  - id: "devin_cloud"
    name: "Devin (cloud)"
    tier: 3
    reason: "MCP servers attach only through the UI; API sessions cannot control them."
