# Every framework and harness considered for coverage, with the facts that decide its
# tier. Verified 2026-09-29 against official docs, registries, and source. Facts only;
# "unknown" means the sources were silent. scripts/measure_harness.py reads a harness's
# row from here.
#
# Tiers
#   1  measure now: first-party MCP client, runs headless, in demand
#   2  measure after tier 1: first-party client, headless, long tail
#   3  excluded, with the reason; revisit when the reason changes
#
# reach: which protocol revisions the adapter can negotiate, from its SDK pin.
#   sdk1 = MCP SDK 1.x only -> 2025-11-25 only.  sdk2 = 2.x or both -> both snapshots.
#   own  = hand-rolled JSON-RPC; reach must be measured, not inferred.

frameworks:
  # ---- already measured (5) ----
  - id: crewai
    name: CrewAI
    org: crewAIInc
    lang: python
    package: crewai-tools[mcp]
    adapter: crewai_tools.MCPServerAdapter (legacy, via mcpadapt)
    reach: sdk1
    tier: 1
    status: measured
    note: >-
      crewai 1.15.23 also ships a native client, crewai.mcp.MCPClient with
      MCPServerStdio/MCPServerHTTP/MCPServerSSE and Agent(mcps=[...]). Pins mcp~=1.28.1.
      Exposes prompts (list_prompts, get_prompt), not resources. Task F-crewai-native adds
      it as a second adapter row: the legacy row stays because it is what most tutorials use.
  - id: langchain
    name: LangChain
    org: langchain-ai
    lang: python
    package: langchain-mcp-adapters
    adapter: MultiServerMCPClient / load_mcp_tools
    reach: sdk1
    tier: 1
    status: measured
  - id: openai_agents
    name: OpenAI Agents SDK
    org: openai
    lang: python
    package: openai-agents
    adapter: agents.mcp.MCPServerStdio / MCPServerStreamableHttp
    reach: sdk2
    tier: 1
    status: measured
  - id: pydantic_ai
    name: Pydantic AI
    org: pydantic
    lang: python
    package: pydantic-ai-slim[mcp]
    adapter: pydantic_ai.mcp.MCPToolset (wraps fastmcp Client)
    reach: sdk2
    tier: 1
    status: measured
    hooks: [sampling, elicitation, roots]
  - id: mastra
    name: Mastra
    org: mastra-ai
    lang: typescript
    package: "@mastra/mcp"
    adapter: MCPClient
    reach: sdk2
    tier: 1
    status: measured
    hooks: [elicitation]

