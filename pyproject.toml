[project]
name = "mcp-mirror"
version = "0.1.0"
description = "Capture and diff MCP tool definitions at explicit agent-framework adaptation boundaries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arcade.dev" }]
keywords = ["mcp", "llm", "agents", "tools", "diff", "authorization", "langchain", "pydantic-ai", "crewai"]
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "anyio>=4.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-mcp-adapters>=0.1.0",
    "langchain-core>=0.3.0",
]
pydantic-ai = [
    "pydantic-ai-slim[mcp]>=0.0.30",
]
crewai = [
    "crewai-tools[mcp]>=0.25.0",
]
# CrewAI's own MCP client (crewai.mcp, Agent(mcps=[...])), measured as its own row.
crewai-native = [
    "crewai>=1.15.23",
]
openai-agents = [
    "openai-agents>=0.2.0",
]
google-adk = [
    "google-adk[mcp]>=2.0.0",
]
ms-agent-framework = [
    "agent-framework-core>=1.19.0",
]
autogen = [
    "autogen-ext[mcp]>=0.7.0",
    "autogen-agentchat>=0.7.0",
]
strands = [
    "strands-agents>=1.0.0",
]
semantic-kernel = [
    "semantic-kernel>=1.44.1",
    # semantic-kernel requires azure-ai-agents>=1.2.0b3, a pre-release; naming it here
    # is what lets uv resolve it.
    "azure-ai-agents>=1.2.0b6",
]
llamaindex = [
    "llama-index-tools-mcp>=0.2.0",
]
haystack = [
    "mcp-haystack>=1.5.1",
]
smolagents = [
    "smolagents[mcp]>=1.26.0",
]
# NOTE: Mastra is a TypeScript framework with no Python package. Its renderer drives
# the real @mastra/mcp client via a Node worker; enable it with:
#   cd src/mcp_mirror/renderers/mastra_node && npm install   (requires Node on PATH)
all = [
    "langchain-mcp-adapters>=0.1.0",
    "langchain-core>=0.3.0",
    "pydantic-ai-slim[mcp]>=0.0.30",
    "crewai-tools[mcp]>=0.25.0",
    "crewai>=1.15.23",
    "openai-agents>=0.2.0",
    "google-adk[mcp]>=2.0.0",
    "agent-framework-core>=1.19.0",
    "autogen-ext[mcp]>=0.7.0",
    "autogen-agentchat>=0.7.0",
    "strands-agents>=1.0.0",
    "semantic-kernel>=1.44.1",
    "azure-ai-agents>=1.2.0b6",
    "llama-index-tools-mcp>=0.2.0",
    "mcp-haystack>=1.5.1",
    "smolagents[mcp]>=1.26.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcp-mirror = "mcp_mirror.cli:app"

[project.urls]
Homepage = "https://canaiuse.com"
Documentation = "https://canaiuse.com/#/method"
# The one place the repository URL lives: build_data.py copies it into every published
# aggregate, and the site links captures and the harness wire directory from there.
Repository = "https://github.com/ArcadeAI/can-ai-use"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mirror"]

[tool.hatch.build.targets.wheel.force-include]
"data/fulldata" = "mcp_mirror/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
